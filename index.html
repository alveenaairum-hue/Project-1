<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A little celebration of the web.">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f4ff;
      --muted: #b4b3cc;
      --accent: #a78bfa;
      --mint: #75f0cc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 18%, rgba(124, 91, 239, .25), transparent 36%),
        radial-gradient(ellipse at 83% 79%, rgba(45, 208, 180, .13), transparent 34%),
        #0b1020;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image: radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent),
        radial-gradient(1px 1px at 72% 20%, #b8a8ff 99%, transparent),
        radial-gradient(2px 2px at 88% 62%, #fff 99%, transparent),
        radial-gradient(1px 1px at 38% 83%, #9cf5dd 99%, transparent),
        radial-gradient(1px 1px at 56% 52%, #fff 99%, transparent);
      background-size: 280px 260px;
      mask-image: linear-gradient(to bottom, black, transparent 95%);
    }

    main {
      position: relative;
      width: min(90vw, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0, 0, 0, .42), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: inline-grid;
      width: 58px;
      height: 58px;
      margin-bottom: 1.5rem;
      place-items: center;
      border: 1px solid rgba(167, 139, 250, .4);
      border-radius: 19px;
      color: var(--mint);
      background: rgba(167, 139, 250, .12);
      font-size: 1.65rem;
      box-shadow: 0 0 36px rgba(167,139,250,.18);
    }

    .eyebrow {
      margin: 0 0 .8rem;
      color: var(--mint);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.3rem, 10vw, 6.7rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 760;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #d8c6ff 8%, #a78bfa 48%, #75f0cc 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 390px;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }

    .rule {
      width: 54px;
      height: 2px;
      margin: 2rem auto 1.35rem;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--mint));
    }

    .footer {
      color: #85859f;
      font-size: .8rem;
      letter-spacing: .04em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A tiny beginning</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p class="intro">A little bit of HTML, a little bit of wonder. Here’s to everything you’re about to make.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="footer">Made for the wide-open web&nbsp; ✨</div>
  </main>
</body>
</html>
